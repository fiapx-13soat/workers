name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ffmpeg é necessário: os testes de extração rodam ffmpeg real via ProcessBuilder
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers (LocalStack, RabbitMQ) usa o Docker do runner ubuntu-latest
      - name: Build e testes
        run: mvn -B --no-transfer-progress verify

  build-and-push:
    name: Build image & push to ECR
    needs: test
    runs-on: ubuntu-latest
    # só publica em push na main ou tag de versão — nunca em PR
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag imutável
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Learner Lab: sem OIDC. Credenciais temporárias do lab vêm dos secrets
      # (rotacionam a cada sessão do lab — recolar antes de publicar).
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/fiapx-workers
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Imagem publicada: $IMAGE:$TAG (+ latest)"
